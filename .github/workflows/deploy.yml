name: Deploy ke Cloudflare
on:
  push:
    branches: [main]
    # Commit data bot dan dokumentasi tidak mengubah tampilan situs.
    paths-ignore:
      - 'public/data/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Data dibaca dari raw GitHub agar pembaruan cron tidak perlu deploy ulang.
      VITE_DATA_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/public/data/latest.json
    steps:
      # Tanpa token, deploy dilewati (bukan gagal) agar tidak mengirim email kegagalan di setiap push.
      - name: Token Cloudflare belum dipasang
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Deploy dilewati karena secret CLOUDFLARE_API_TOKEN belum dipasang. Lihat docs/DEPLOY.md."
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: oven-sh/setup-bun@v2
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          bun-version: '1.4.2'
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: bun install --frozen-lockfile --backend hardlink
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: bun test
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: bun run build
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: bunx --bun wrangler deploy
